[package]
name = "controlab-native"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Interface nativa Rust do ControLAB"
default-run = "controlab"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "controlab"
path = "src/main.rs"

[dependencies]
blocklab-gui = { path = "../crates/blocklab-gui" }
blocklab-core = { path = "../crates/blocklab-core" }
mscript = { path = "../crates/mscript" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "android-native-activity"] }
egui_plot = "=0.37.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "=0.49.0", default-features = false }

# GNOME/Wayland has no server-side title bars: winit draws Adwaita-style ones, like GTK apps.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "android")'.dependencies]
controlab-engine = { path = "../crates/control-engine" }
jni = "=0.22.4"
android-activity = { version = "0.6.1", features = ["native-activity"] }
