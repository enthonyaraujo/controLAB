plugins {
    id 'com.android.application'
}

// Select only installed Rust targets, e.g. -PnativeAbis=arm64-v8a,x86_64.
def nativeAbis = providers.gradleProperty('nativeAbis').getOrElse('arm64-v8a').split(',').toList()
def repositoryRoot = rootProject.file('../..')
// The workspace Cargo.toml is the single version source (scripts/set_version.py).
def appVersion = (new File(repositoryRoot, 'Cargo.toml').text =~ /(?m)^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"/)[0]
def releaseKeystore = System.getenv('CONTROLAB_KEYSTORE')
android {
    namespace 'br.com.enthony.controlab'
    compileSdk 36
    defaultConfig {
        applicationId 'br.com.enthony.lgrstudio'
        minSdk 24
        targetSdk 36
        versionCode appVersion[1].toInteger() * 10000 + appVersion[2].toInteger() * 100 + appVersion[3].toInteger()
        versionName "${appVersion[1]}.${appVersion[2]}.${appVersion[3]}"
        ndk { abiFilters.addAll(nativeAbis) }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('CONTROLAB_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CONTROLAB_KEY_ALIAS')
                keyPassword System.getenv('CONTROLAB_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Without a release key the APK is still installable, signed with the debug key.
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
    sourceSets {
        debug.jniLibs.srcDir layout.buildDirectory.dir('generated/native/debug')
        release.jniLibs.srcDir layout.buildDirectory.dir('generated/native/release')
    }
}

['debug', 'release'].each { variant ->
    def capitalized = variant.capitalize()
    def compileTask = tasks.register("compileNative${capitalized}", Exec) {
        group = 'build'
        description = "Build the Rust UI, scientific engine and .m interpreter for ${variant}"
        workingDir rootProject.projectDir
        def output = layout.buildDirectory.dir("generated/native/${variant}")
        inputs.files(fileTree(new File(repositoryRoot, 'native')) {
            include '**/*.rs', '**/Cargo.toml', 'modules.json'
            exclude 'android/**', '**/target/**'
        })
        inputs.files(new File(repositoryRoot, 'Cargo.toml'), new File(repositoryRoot, 'Cargo.lock'))
        inputs.files(fileTree(new File(repositoryRoot, 'assets')))
        inputs.files(fileTree(new File(repositoryRoot, 'crates')) {
            include '**/*.rs', '**/Cargo.toml'
            exclude '**/target/**'
        })
        inputs.files(fileTree(new File(repositoryRoot, 'xtask')) {
            include '**/*.rs', 'Cargo.toml'
        })
        inputs.property('abis', nativeAbis.join(','))
        inputs.property('variant', variant)
        outputs.dir output
        commandLine 'cargo', 'run', '--locked', '--manifest-path',
            new File(repositoryRoot, 'Cargo.toml').absolutePath, '-p', 'xtask', '--',
            'android', '--abis', nativeAbis.join(','),
            '--profile', variant, '--output', output.get().asFile.absolutePath
        if (providers.gradleProperty('nativeOffline').getOrElse('false').toBoolean()) {
            args '--offline'
        }
    }
    tasks.configureEach {
        if (name == "pre${capitalized}Build") { dependsOn compileTask }
    }
}
