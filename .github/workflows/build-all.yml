name: Multiplatform Build & Release (Linux, Windows, Android)

on:
  push:
    branches: [main, enthony/migrate-rust, enthony/migrate-python-to-rust]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  # =========================================================================
  # 1. LINUX (.deb, .rpm, .AppImage)
  # =========================================================================
  linux:
    name: Linux (deb, rpm, AppImage)
    # The packages require the glibc of this image (2.39) or newer.
    runs-on: ubuntu-24.04
    env:
      CONTROLAB_SCIENTIFIC_BACKEND: rust
    steps:
      - uses: actions/checkout@v5

      - name: Bibliotecas gráficas, display headless e ferramentas de pacote
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev \
            xvfb xauth rpm desktop-file-utils

      - name: Rust stable
        run: |
          rustup update stable
          rustup default stable

      - name: Sincronizar versão com a Git Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo xtask version "$GITHUB_REF_NAME"

      - uses: Swatinem/rust-cache@v2

      - name: Rejeitar fontes de frontend e Node
        run: cargo xtask check-sources

      - name: Compilar o workspace nativo
        run: cargo build --locked --release --workspace

      - name: Testes e verificações Rust
        run: |
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo fmt --all --check
          desktop-file-validate packaging/linux/controlab.desktop

      - name: Gerar o pacote nativo independente
        run: cargo xtask package --release --skip-build

      - name: Executar engine Rust e interface empacotadas
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 WINIT_UNIX_BACKEND=x11 cargo xtask validate-bundle dist/native/controlab --ui

      - name: Instalar appimagetool
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: Gerar pacotes Linux (deb, rpm, AppImage)
        env:
          # Runners have no FUSE: AppImages extract themselves instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: cargo xtask installers deb rpm appimage --bundle dist/native/controlab --output release

      - name: Verificar pacotes instalados
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          sudo apt-get install -y ./release/ControLAB-*.deb
          test "$(readlink -f /usr/bin/controlab)" = /opt/controlab/controlab
          cargo xtask validate-bundle /opt/controlab
          rpm -qpi release/ControLAB-*.rpm
          rpm -qpR release/ControLAB-*.rpm
          pushd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE"/release/ControLAB-*.AppImage --appimage-extract > /dev/null
          popd
          cargo xtask validate-bundle "$RUNNER_TEMP/squashfs-root/opt/controlab"

      - uses: actions/upload-artifact@v4
        with:
          name: ControLAB-Linux
          path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
          if-no-files-found: error

  # =========================================================================
  # 2. WINDOWS (instalador .exe NSIS)
  # =========================================================================
  windows:
    name: Windows (instalador NSIS)
    runs-on: windows-latest
    env:
      CONTROLAB_SCIENTIFIC_BACKEND: rust
    steps:
      - uses: actions/checkout@v5

      - name: Rust stable
        run: |
          rustup update stable
          rustup default stable

      - name: Sincronizar versão com a Git Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo xtask version "$GITHUB_REF_NAME"

      - uses: Swatinem/rust-cache@v2

      - name: Compilar o workspace nativo
        run: cargo build --locked --release --workspace

      - name: Gerar o pacote nativo independente
        run: cargo xtask package --release --skip-build

      - name: Executar os seis módulos científicos Rust e fórmulas empacotados
        run: cargo xtask validate-bundle dist/native/controlab

      - name: Instalar NSIS
        run: |
          if ! command -v makensis > /dev/null; then
            choco install nsis -y --no-progress
          fi
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"

      - name: Gerar instalador Windows (.exe)
        run: cargo xtask installers nsis --bundle dist/native/controlab --output release

      - name: Verificar instalação silenciosa
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\ControLAB-*.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'ControLAB'
          Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$target" -Wait
          cargo xtask validate-bundle $target
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Process -FilePath (Join-Path $target 'uninstall.exe') -ArgumentList '/S' -Wait

      - uses: actions/upload-artifact@v4
        with:
          name: ControLAB-Windows
          path: release/*.exe
          if-no-files-found: error

  # =========================================================================
  # 3. ANDROID (.apk: interface e engine científica Rust)
  # =========================================================================
  android:
    name: Android (APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Rust stable com alvo Android
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-linux-android

      - name: Sincronizar versão com a Git Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: cargo xtask version "$GITHUB_REF_NAME"

      - uses: Swatinem/rust-cache@v2
        with:
          # cargo xtask android uses this target directory for cross-compilation.
          workspaces: . -> build/native-android

      - name: Chave de assinatura (opcional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 ausente: APK assinado com a chave debug do runner."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "CONTROLAB_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "CONTROLAB_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "CONTROLAB_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "CONTROLAB_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Compilar APK Android
        run: |
          chmod +x native/android/gradlew
          native/android/gradlew --project-dir native/android --no-daemon :app:assembleRelease \
            -PnativeAbis=arm64-v8a

      - name: Renomear APK para distribuição
        run: |
          VERSION="$(cargo xtask version)"
          mkdir -p release
          cp native/android/app/build/outputs/apk/release/app-release.apk "release/ControLAB-v${VERSION}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ControLAB-Android-APK
          path: release/*.apk
          if-no-files-found: error

  # =========================================================================
  # 4. RELEASE NO GITHUB (TAGS v*)
  # =========================================================================
  publish-release:
    name: Publicar GitHub Release
    needs: [linux, windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - run: ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
