name: Native Linux Build and Validation

on:
  push:
    branches: [main, enthony/migrate-rust]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src/python
      CONTROLAB_PYTHON: python
      CONTROLAB_RUNTIME: ${{ github.workspace }}/target/release/controlab-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native graphics and headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libgl1-mesa-dev libxkbcommon-dev libwayland-dev xvfb xauth
      - name: Rust and scientific Python build dependencies
        run: |
          rustup update stable
          rustup default stable
          python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Reject frontend and Node sources
        run: python scripts/check_native_sources.py
      - name: Compile the native workspace
        run: cargo build --locked --release --workspace
      - name: Rust and Python regression tests
        run: |
          cargo test --locked --workspace
          cargo clippy -p controlab-native --all-targets -- -D warnings
          cargo fmt -p controlab-native --check
          python -m unittest discover -s tests
      - name: Build the independent Linux bundle
        run: python scripts/package_native.py --release --skip-build
      - name: Run the bundled engine and UI without source or Python fallbacks
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 WINIT_UNIX_BACKEND=x11 python scripts/validate_native_bundle.py dist/native/controlab --ui
      - name: Archive the complete Linux application
        run: tar -C dist/native -czf dist/controlab-linux-x86_64.tar.gz controlab
      - uses: actions/upload-artifact@v4
        with:
          name: controlab-linux-x86_64
          path: dist/controlab-linux-x86_64.tar.gz
          if-no-files-found: error
