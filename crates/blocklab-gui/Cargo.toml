[package]
autobins = false
name = "blocklab-gui"
description = "Interface gráfica do BlockLab (eframe/egui)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# A interface é uma biblioteca: o executável de computador (src/main.rs)
# a usa, e no Android ela vira a `libblocklab_gui.so` que o APK carrega
# (src/android.rs).
[lib]
name = "blocklab_gui"
crate-type = ["lib", "cdylib"]

[features]
standalone-apk = []



[dependencies]
blocklab-core = { path = "../blocklab-core" }
# Recursos comuns às plataformas; os específicos ficam abaixo.
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "glow",
] }
png = "0.18.1"
resvg = { version = "0.49.0", default-features = false, features = ["text"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Os demais recursos padrão do eframe.
eframe = { version = "0.36.2", default-features = false, features = [
    "wayland",
    "web_screen_reader",
    "x11",
] }
rfd = "0.17.2"
# Recursos padrão do winit (o "winit/default" do eframe), que não dá para
# pedir através do eframe.
winit = "0.30.13"

[target.'cfg(target_os = "android")'.dependencies]
# Sem accesskit: o eframe só o aceita com a GameActivity (que exige Gradle).
eframe = { version = "0.36.2", default-features = false, features = [
    "android-native-activity",
] }
# JNI para ler os recuos do sistema e ajustar os ícones das barras
# (src/android_insets.rs); mesma versão que o android-activity já usa.
jni = "0.22.4"
# Para o tipo `AndroidApp` do ponto de entrada (mesma versão do eframe) e
# a ligação da janela com o wgpu (rwh_06).
winit = { version = "0.30.13", default-features = false, features = [
    "android-native-activity",
    "rwh_06",
] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }

# Empacotamento com android/build-apk.sh (cargo-apk; ver README).
[package.metadata.android]
package = "io.github.blocklab"
apk_name = "blocklab"
build_targets = ["aarch64-linux-android"]
# Ícone do inicializador (gerado a partir de src/icon.rs).
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "BlockLab"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[package.metadata.android.application.activity]
# Girar a tela ou abrir o teclado não recria a atividade (o egui só
# redimensiona).
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|navigation|density|uiMode"
launch_mode = "singleTask"
