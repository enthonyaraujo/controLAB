[package]
name = "controlab-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Motor científico Rust do ControLAB"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nalgebra = "0.35"
num-complex = "0.4"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
base64 = "0.23"
resvg = { version = "=0.49.0", default-features = false, features = ["text"] }
latex-rust = "=3.0.1"
regex = "1"

[lints.rust]
unsafe_code = "forbid"
