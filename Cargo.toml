[workspace]
members = ["native", "crates/mscript", "crates/control-engine", "xtask"]
default-members = ["native", "crates/mscript", "crates/control-engine", "xtask"]
resolver = "3"

# `cargo xtask version` updates this version, shared by every crate.
[workspace.package]
version = "6.0.0"
license = "MIT"
edition = "2024"
