[workspace]
members = ["native", "crates/mscript", "crates/control-engine", "xtask", "crates/blocklab-core", "crates/blocklab-gui"]
default-members = ["native", "crates/mscript", "crates/control-engine", "xtask", "crates/blocklab-core", "crates/blocklab-gui"]
resolver = "3"

# `cargo xtask version` updates this version, shared by every crate.
[workspace.package]
version = "6.2.0"
license = "MIT"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"
